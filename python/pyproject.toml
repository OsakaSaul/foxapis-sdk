[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foxapis"
version = "1.5.0"
description = "Tiny Python client for the FoxAPIs people-and-company intelligence API, generated from its OpenAPI file."
requires-python = ">=3.8"
license = { text = "MIT" }
readme = "README.md"

[project.urls]
Homepage = "https://foxapis.com/docs/"

[tool.setuptools]
packages = ["foxapis"]
